# Local development: Postgres only. The API and web app run on the host via `npx turbo run dev`.
# For the production stack (API + Caddy), see docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: hothotleads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hothotleads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hothotleads}
      POSTGRES_DB: hothotleads
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - hothotleads-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hothotleads", "-d", "hothotleads"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hothotleads-pgdata:
